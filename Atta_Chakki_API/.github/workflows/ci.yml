name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Syntax Lint (php -l)
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./cache/*" -print0 | xargs -0 -n 1 php -l
